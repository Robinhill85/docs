<svg viewBox="0 0 830 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A forked subagent replays the parent's prior exploration steps, then continues working on its own before handing an answer back — it never starts from a blank slate.">
  <defs>
    <marker id="arrow-shared" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 8,4 0,8" fill="#2563EB"></polygon>
    </marker>
    <marker id="arrow-call" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 8,4 0,8" fill="#06B6D4"></polygon>
    </marker>
    <marker id="arrow-result" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 8,4 0,8" fill="#10B981"></polygon>
    </marker>
  </defs>

  <rect x="0" y="0" width="830" height="520" fill="#FFFFFF"></rect>

  <!-- time axis -->
  <line x1="40" y1="66" x2="40" y2="500" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-shared)"></line>
  <text x="40" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="12" fill="#64748B">time</text>

  <!-- lane headers -->
  <text x="195" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-weight="600" font-size="15" fill="#0F172A">Main conversation</text>
  <text x="565" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-weight="600" font-size="15" fill="#0F172A">Forked subagent</text>

  <!-- dashed replay arrows: main's prior turns -> fork's replayed copy -->
  <line x1="280" y1="93" x2="470" y2="93" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-shared)"></line>
  <line x1="280" y1="149" x2="470" y2="149" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-shared)"></line>
  <line x1="280" y1="205" x2="470" y2="205" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-shared)"></line>

  <!-- brace-style bracket labeling the three replay arrows as one thing -->
  <path d="M 700 70 Q 715 70 715 93 L 715 172 Q 715 195 700 195" fill="none" stroke="#2563EB" stroke-width="1.3"></path>
  <text x="722" y="127" font-family="ui-sans-serif, system-ui" font-size="11.5" fill="#1E3A8A">inherits prior</text>
  <text x="722" y="141" font-family="ui-sans-serif, system-ui" font-size="11.5" fill="#1E3A8A">exploration</text>

  <!-- brace-style bracket labeling the three purple "own work" boxes -->
  <path d="M 700 294 Q 715 294 715 317 L 715 396 Q 715 419 700 419" fill="none" stroke="#7C3AED" stroke-width="1.3"></path>
  <text x="722" y="359" font-family="ui-sans-serif, system-ui" font-size="11.5" fill="#4C1D95">work the</text>
  <text x="722" y="373" font-family="ui-sans-serif, system-ui" font-size="11.5" fill="#4C1D95">subagent does</text>
  <text x="722" y="387" font-family="ui-sans-serif, system-ui" font-size="11.5" fill="#4C1D95">on its own</text>

  <!-- outbound curved arrow: main's subagent-call turn -> fork's call arrival, carries full context -->
  <path d="M 280 261 C 360 261, 390 261, 470 261" fill="none" stroke="#06B6D4" stroke-width="2.2" marker-end="url(#arrow-call)"></path>
  <text x="375" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11.5" font-weight="600" fill="#0E7490">full context + task</text>

  <!-- return curved arrow: fork's result -> main's result -->
  <path d="M 470 485 C 380 485, 340 317, 320 317 L 280 317" fill="none" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrow-result)"></path>
  <text x="420" y="420" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11.5" font-weight="600" fill="#047857">answer</text>

  <!-- MAIN LANE boxes -->
  <g font-family="ui-sans-serif, system-ui" font-size="12.5">
    <rect x="110" y="70" width="170" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"></rect>
    <text x="195" y="98" text-anchor="middle" fill="#1E3A8A">grep</text>

    <rect x="110" y="126" width="170" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"></rect>
    <text x="195" y="154" text-anchor="middle" fill="#1E3A8A">glob</text>

    <rect x="110" y="182" width="170" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"></rect>
    <text x="195" y="210" text-anchor="middle" fill="#1E3A8A">read file</text>

    <rect x="110" y="238" width="170" height="46" rx="6" fill="#CFFAFE" stroke="#06B6D4" stroke-width="1.6"></rect>
    <text x="195" y="266" text-anchor="middle" font-weight="600" fill="#164E63">delegate to subagent</text>

    <rect x="110" y="294" width="170" height="46" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.6"></rect>
    <text x="195" y="322" text-anchor="middle" font-weight="600" fill="#065F46">result</text>

    <rect x="110" y="350" width="170" height="46" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 4"></rect>
    <text x="195" y="378" text-anchor="middle" fill="#94A3B8">conversation continues</text>
  </g>

  <!-- FORK LANE boxes -->
  <g font-family="ui-sans-serif, system-ui" font-size="12.5">
    <rect x="470" y="70" width="190" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"></rect>
    <text x="565" y="98" text-anchor="middle" fill="#1E3A8A">grep</text>

    <rect x="470" y="126" width="190" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"></rect>
    <text x="565" y="154" text-anchor="middle" fill="#1E3A8A">glob</text>

    <rect x="470" y="182" width="190" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"></rect>
    <text x="565" y="210" text-anchor="middle" fill="#1E3A8A">read file</text>

    <rect x="470" y="238" width="190" height="46" rx="6" fill="#CFFAFE" stroke="#06B6D4" stroke-width="1.6"></rect>
    <text x="565" y="266" text-anchor="middle" font-weight="600" fill="#164E63">call arrives</text>

    <rect x="470" y="294" width="190" height="46" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"></rect>
    <text x="565" y="322" text-anchor="middle" fill="#4C1D95">investigate further</text>

    <rect x="470" y="350" width="190" height="46" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"></rect>
    <text x="565" y="378" text-anchor="middle" fill="#4C1D95">verify</text>

    <rect x="470" y="406" width="190" height="46" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"></rect>
    <text x="565" y="434" text-anchor="middle" fill="#4C1D95">write up finding</text>

    <rect x="470" y="462" width="190" height="46" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.6"></rect>
    <text x="565" y="490" text-anchor="middle" font-weight="600" fill="#065F46">result</text>
  </g>

</svg>
